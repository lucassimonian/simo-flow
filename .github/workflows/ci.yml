name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Simo Flow had only ever been proven on one laptop — one macOS version. All
    # of this is hermetic (no microphone, no models, no network), so there is no
    # reason not to run it across the macOS versions users actually have.
    #
    # Apple Silicon only, deliberately. The README, the topics and the whisper
    # Metal backend all target Apple Silicon, so an Intel runner would gate
    # releases on a platform this app does not claim to support — and GitHub is
    # retiring those images anyway, which showed up immediately as a job that
    # queued for an hour without ever being assigned.
    name: Lint & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # knowing it breaks on exactly one version is the point
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans history, not just the working tree

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PortAudio (sounddevice backend)
        run: brew install portaudio

      - name: Install dependencies
        run: |
          # setuptools is upgraded explicitly, not incidentally: the runner images
          # ship a version with a known advisory, and pip-audit below is set to
          # fail on one. Keeping it current is cheaper than maintaining an
          # exception list, and an exception list is how a real finding gets
          # waved through later.
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      - name: Byte-compile all modules
        run: |
          python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('engine/*.py') + glob.glob('tools/*.py')]"

      # Bug-class rules only — undefined names, broken syntax, bad f-strings
      # (config in pyproject.toml). Style is deliberately not gated: formatting
      # is applied on save, and enforcing it retroactively would fail on files a
      # given change never touched.
      - name: Lint
        run: |
          pip install ruff
          ruff check --output-format=github .

      # Every hermetic test, not just one file — test_units.py alone used to run
      # here, so the other suites could have rotted unnoticed. test_pipeline.py
      # is excluded because it needs a real mic, the whisper models and a running
      # Ollama; it is run by hand before a release.
      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/test_pipeline.py

      # A passing suite does not mean the guards are tested. Two bugs reached the
      # user in one day with green tests, and one test actively asserted the broken
      # behaviour. This breaks each safety guard in turn and fails if the suite
      # stays green — a guard nothing screams about is a guard that will ship
      # broken. Runs the suite once per mutation, so it is the slowest step here
      # and worth every second of it.
      #
      # Pinned to one runner: it rewrites source and re-runs the suite once per
      # mutation, and the guards it checks are not OS-specific. Running it on all
      # three would triple the slowest step in CI to re-prove the same thing.
      - name: Mutation sweep — prove each guard is actually tested
        if: matrix.os == 'macos-14'
        run: python tools/mutation_sweep.py

      # The local DB and log hold the plaintext of everything ever dictated, so a
      # leaked credential in this repo would matter more than most. One runner is
      # enough — git history is the same on all of them.
      - name: Secret scan
        if: matrix.os == 'macos-14'
        run: |
          brew install gitleaks
          gitleaks detect --redact --no-banner --exit-code 1

      # Dependencies are the one attack surface nobody reads. pip-audit checks the
      # installed set against the Python advisory database on every push, so a
      # known CVE in a transitive dependency surfaces here rather than never.
      - name: Audit dependencies for known vulnerabilities
        if: matrix.os == 'macos-14'
        run: |
          pip install pip-audit
          pip-audit --strict --desc
